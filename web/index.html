<body>
<div class="app" id="appRoot">
<header class="topbar">
<button type="button" class="brand" data-nav="hero" aria-label="Oxford Core Vocabulary ホーム"><span class="brandlogo">O.</span><span>Oxford Core<small>VOCABULARY LAB</small></span></button>
<div class="topright"><span class="connection" id="connectionStatus" role="status">Connecting…</span><span class="topview" id="topView">Hero</span><button class="hamburger" id="openMenu" type="button" aria-label="ナビゲーションを開く" aria-controls="drawer" aria-expanded="false">☰</button></div>
</header>
<main class="shell" id="main" tabindex="-1"></main>
<footer class="app-footer">OXFORD CORE VOCABULARY · YOUR PRIVATE LANGUAGE LAB</footer>
</div>

<div id="navContent"></div>
</aside>
<dialog class="collection-dialog" id="collectionDialog" aria-labelledby="collectionTitle"><div class="dialog-head"><h2 id="collectionTitle">Collections</h2><button type="button" class="close" data-close-collections aria-label="Collectionを閉じる">✕</button></div><div class="dialog-body" id="collectionBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
(() => {
const $ = (s,root=document) => root.querySelector(s);
const $$ = (s,root=document) => Array.from(root.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles = {hero:'Hero',view_selection:'View Selection',quiz_selection:'Quiz Selection',submode_selection:'Submode Selection',dictionary:'Dictionary',data:'Data',cloze_test:'Cloze Test',word_recall:'Word Recall',reading_review:'Reading Review',sentence_generation:'Sentence Generation'};
const quizNames = {cloze:'Cloze Test',word_recall:'Word Recall',reading_review:'Reading Review'};
const variantNames = {en_to_jp:'EN → JP',jp_to_en:'JP → EN',word_and_example:'WORD + EXAMPLE',jp_and_example:'JP + EXAMPLE'};
const variants = {word_recall:['en_to_jp','jp_to_en'],cloze:[],reading_review:['word_and_example','jp_and_example']};
const resultNames = [[1,'Correct'],[2,'Incorrect'],[3,'Unknown'],[4,'Reading：できた'],[5,'Reading：できなかった']];
const posLabels = ['adjective','adverb','auxiliary verb','conjunction','definite article','determiner','exclam','indefinite article','infinitive marker','linking verb','modal verb','noun','number','preposition','pronoun','verb'];
const defaultMeta = {count:6100,pos:posLabels.map((label,i)=>({code:i+1,label})),levels:[{code:1,label:'3000'},{code:2,label:'5000'},{code:3,label:'空欄'}],sections:[...Array.from({length:6},(_,i)=>({code:i+1,label:'S'+(i+1)})),...Array.from({length:12},(_,i)=>({code:i+7,label:'W'+(i+1)})),{code:19,label:'空欄'}]};
const freshFilter = () => ({free_text:'',corpus_ids:[],pos_codes:[],level_codes:[],section_codes:[],collection_ids:[],initial_letter:0,history_result:[],confidence_range:null,attempt_time_range:null,requested_count:20});
const S = {view:'hero',meta:defaultMeta,ready:false,bootError:'',activity:null,menu:false,collections:[],collectionPanel:null,filters:{dictionary:freshFilter(),setup:freshFilter(),data:freshFilter()},dictionary:{items:[],total:0,offset:0,limit:30,jp:false,revealed:new Set(),loading:false,focus:0,error:''},setup:{quiz_type:'word_recall',variant:'en_to_jp',source_mode:'new',total:null,cloze_skipped:0,loading:false,starting:false,error:'',sessions:[]},session:null,question:null,draft:null,quizError:'',quizLoading:false,data:{records:null,offset:0,limit:20,action_offset:0,action_limit:30,quiz_type:'',variant:'',screen:'',event:'',tab:'attempts',filtersOpen:false,loading:false,error:''}};
const main = $('#main');
let toastTimer,searchTimer,candidateTimer,dataTimer,routeVersion=0,sessionOperation=0,dictVersion=0,candidateVersion=0,dataVersion=0,questionVersion=0,flushPromise=null,navFocus=null,revealRelease=null;
let pending=[];
try { const saved=JSON.parse(sessionStorage.getItem('ocv.pendingActions')||'[]');if(Array.isArray(saved))pending=saved.filter(x=>x&&Number.isFinite(x.occurred_at)&&x.activity_id); } catch(_e) {}
function persistPending(){try{sessionStorage.setItem('ocv.pendingActions',JSON.stringify(pending));}catch(_e){}}
function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200);}
function status(){const el=$('#connectionStatus');el.classList.toggle('warning',!!S.bootError||pending.length>100);el.innerHTML=S.bootError?'接続を確認':!S.ready?'Connecting…':`<span class="status-dot"></span>${pending.length>0?pending.length+' 操作を送信待ち':'Connected'}`;}
function action(event,target=null,value=null,view=S.view){return {occurred_at:Date.now(),activity_id:S.activity,screen:view,event,target:target===null?null:String(target),value:value===null?null:String(value),session_id:isQuiz(view)&&S.session?S.session.session_id:null};}
function log(event,target=null,value=null,view=S.view){pending.push(action(event,target,value,view));persistPending();status();if(pending.length>=40)void flushActions();}
async function api(path,body,method){const options={method:method||(body===undefined?'GET':'POST'),headers:{Accept:'application/json'}};if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}let response;try{response=await fetch(path,options);}catch(_e){const e=new Error('サーバーへ接続できません。接続を確認してください。');e.network=true;throw e;}const type=response.headers.get('content-type')||'';let data;try{data=type.includes('json')?await response.json():{error:await response.text()};}catch(_e){throw new Error('サーバーの応答を読み取れませんでした。');}if(!response.ok){const e=new Error(data.error||'処理を完了できませんでした。');e.code=data.code;e.status=response.status;throw e;}return data;}
async function flushActions(keepalive=false){if(!S.activity||!pending.length||flushPromise)return flushPromise;pending.forEach(e=>{if(!e.activity_id)e.activity_id=S.activity;});const batch=pending.slice(0,100);const sent_at=Date.now();flushPromise=(async()=>{try{const response=await fetch('/api/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events:batch,sent_at}),keepalive});if(!response.ok)throw new Error('Action log was not saved');await response.json();pending.splice(0,batch.length);persistPending();}catch(_e){persistPending();}finally{flushPromise=null;status();}})();return flushPromise;}
function fmtDate(t){return t==null?'日時不明':new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t));}
function fmtShortDate(t){if(t==null)return ['日時不明',''];const d=new Date(t);return [new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d),new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)];}
function fmtDuration(ms){const secs=Math.max(0,Math.floor((Number(ms)||0)/1000)),h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),s=secs%60;return h?`${h}時間 ${m}分`:m?`${m}分 ${s}秒`:`${s}秒`;}
function num(v){return Number(v||0).toLocaleString('en-GB');}
function id8(v){return String(v).padStart(8,'0');}
function isQuiz(view=S.view){return ['word_recall','cloze_test','reading_review'].includes(view);}
function quizView(q){return q==='cloze'?'cloze_test':q;}
function targetQuestion(){return S.question?'question:'+S.question.question_id:null;}
function dateValue(ms,end=false){if(ms==null||ms<0)return '';const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateMillis(value,end=false){if(!value)return -1;const [y,m,d]=value.split('-').map(Number);return end?new Date(y,m-1,d+1).getTime()-1:new Date(y,m-1,d).getTime();}
function noticeError(message){return message?`<div class="error-banner" role="alert">${esc(message)}</div>`:'';}
function empty(message,detail=''){return `<div class="empty">${esc(message)}${detail?`<p>${esc(detail)}</p>`:''}</div>`;}
function title(overline,heading,lead='',extra=''){return `<section class="large-title"><div class="title-row"><div><span class="eyebrow">${esc(overline)}</span><h1>${heading}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div>${extra}</div></section>`;}
function optionList(values,selected,emptyLabel=null){return (emptyLabel!==null?`<option value="">${esc(emptyLabel)}</option>`:'')+values.map(v=>{const val=typeof v==='string'?v:v.value,label=typeof v==='string'?(variantNames[v]||quizNames[v]||titles[v]||v):v.label;return `<option value="${esc(val)}"${String(val)===String(selected)?' selected':''}>${esc(label)}</option>`;}).join('');}
function alphabet(context){const f=S.filters[context];return `<div class="alphabet" aria-label="頭文字フィルター" data-alphabet="${context}">${['All',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map((l,i)=>`<button class="letter${f.initial_letter===i?' selected':''}" type="button" data-letter="${i}" data-context="${context}" aria-pressed="${f.initial_letter===i}" aria-label="${l==='All'?'すべての頭文字':l+'で始まる語'}">${l}</button>`).join('')}</div>`;}
function checks(context,key,items){const f=S.filters[context];return `<div class="checks">${items.map(item=>{const code=Array.isArray(item)?item[0]:item.code,label=Array.isArray(item)?item[1]:item.label;return `<label class="check"><input type="checkbox" data-filter="${key}" data-context="${context}" value="${esc(code)}"${(f[key]||[]).map(String).includes(String(code))?' checked':''}>${esc(label||'空欄')}</label>`;}).join('')}</div>`;}
function filterPanel(context,{history=false,compact=false}={}){const f=S.filters[context],meta=S.meta;const common=meta.pos.filter(p=>[12,16,1,2].includes(p.code)).sort((a,b)=>[12,16,1,2].indexOf(a.code)-[12,16,1,2].indexOf(b.code));const rest=meta.pos.filter(p=>![12,16,1,2].includes(p.code));const pickedRest=f.pos_codes.some(c=>![12,16,1,2].includes(c));return `<section class="filter-panel${compact?' compact':''}" data-filter-panel="${context}" aria-label="${context==='setup'?'出題の':context==='data'?'回答履歴の':''}検索条件"><div class="filterhead"><span class="eyebrow">COMMON FILTERS</span><button class="linklike" type="button" data-reset="${context}">解除</button></div><form data-search-form="${context}" class="filter-section"><label class="fieldname" for="${context}Search">WORD / EXAMPLE / JP / SECTION</label><div class="search-line"><input id="${context}Search" class="filter-search" type="search" value="${esc(f.free_text)}" data-query="${context}" placeholder="語・例文・日本語・SECTIONを検索" autocomplete="off"><button type="submit" class="btn secondary" aria-label="検索を適用">検索</button></div></form><div class="filter-grid"><fieldset class="filter-section"><legend class="fieldname">POS <small>複数可</small></legend>${checks(context,'pos_codes',common)}<details class="filter-details"${pickedRest?' open':''}><summary>すべての品詞（16種類）</summary>${checks(context,'pos_codes',rest)}</details></fieldset><fieldset class="filter-section"><legend class="fieldname">LEVEL <small>複数可</small></legend>${checks(context,'level_codes',meta.levels)}</fieldset></div><details class="filter-details"${f.section_codes.length?' open':''}><summary>SECTION${f.section_codes.length?' · '+f.section_codes.length+' 選択':''}</summary>${checks(context,'section_codes',meta.sections)}</details><details class="filter-details"${f.collection_ids.length?' open':''}><summary>Collection${f.collection_ids.length?' · '+f.collection_ids.length+' 選択':''}</summary>${S.collections.length?checks(context,'collection_ids',S.collections.map(c=>({code:c.collection_id,label:c.name+' ('+c.count+')'}))):'<span class="fine">Collectionはまだありません。</span>'}<button type="button" class="linklike" data-manage-collections>Collectionを管理</button></details>${history?`<fieldset class="filter-section history-conditions"><legend class="fieldname">履歴条件 <small>複数可</small></legend>${checks(context,'history_result',resultNames)}<div class="filter-section"><label class="check"><input type="checkbox" data-confidence-filter="${context}"${f.confidence_range?' checked':''}>Confidenceで絞り込む</label><div class="range-filter spaced" data-confidence-range="${context}"${f.confidence_range?'':' hidden'}><label class="field-label">最低値<input type="number" min="0" max="100" value="${f.confidence_range?.[0]??0}" data-range-min="${context}" aria-label="Confidence最低値"></label><span class="fine">〜</span><label class="field-label">最高値<input type="number" min="0" max="100" value="${f.confidence_range?.[1]??40}" data-range-max="${context}" aria-label="Confidence最高値"></label></div></div><div class="filter-section"><span class="fieldname">回答日時 <small>この端末の現地時間</small></span><div class="two"><label class="field-label">開始日<input type="date" data-date-from="${context}" value="${dateValue(f.attempt_time_range?.[0])}"></label><label class="field-label">終了日<input type="date" data-date-to="${context}" value="${dateValue(f.attempt_time_range?.[1])}"></label></div></div></fieldset>`:''}<p class="fine">未選択はすべて。検索語はすべてを含む行が対象です。<br>同じ項目内の選択はOR、異なる項目はAND。</p></section>`;}
function readFilters(context){const f=S.filters[context],panel=$(`[data-filter-panel="${context}"]`);if(!panel)return f;const q=$(`[data-query="${context}"]`,panel);if(q)f.free_text=q.value;for(const key of ['pos_codes','level_codes','section_codes','collection_ids','history_result']){const inputs=$$(`[data-filter="${key}"]`,panel);if(inputs.length)f[key]=inputs.filter(e=>e.checked).map(e=>key==='collection_ids'?e.value:Number(e.value));}const enabled=$(`[data-confidence-filter="${context}"]`,panel);if(enabled){const lo=$(`[data-range-min="${context}"]`,panel),hi=$(`[data-range-max="${context}"]`,panel);f.confidence_range=enabled.checked?[Number(lo.value),Number(hi.value)]:null;$(`[data-confidence-range="${context}"]`,panel).hidden=!enabled.checked;}const from=$(`[data-date-from="${context}"]`,panel),to=$(`[data-date-to="${context}"]`,panel);if(from&&to)f.attempt_time_range=from.value||to.value?[dateMillis(from.value),dateMillis(to.value,true)]:null;f.collection_ids=f.collection_ids.filter(id=>S.collections.some(c=>c.collection_id===id));return f;}
function validateFilter(f){if(f.confidence_range&&(!f.confidence_range.every(x=>Number.isInteger(x)&&x>=0&&x<=100)||f.confidence_range[0]>f.confidence_range[1]))throw new Error('Confidenceは0〜100で、最低値を最高値以下にしてください。');if(f.attempt_time_range&&f.attempt_time_range[0]!==-1&&f.attempt_time_range[1]!==-1&&f.attempt_time_range[0]>f.attempt_time_range[1])throw new Error('開始日は終了日以前にしてください。');}
function applyFilters(context,event='filter'){readFilters(context);log(event,context+':filters',event==='search'?S.filters[context].free_text:null);if(context==='dictionary'){S.dictionary.offset=0;void loadDictionary();}else if(context==='setup'){void loadCandidates();}else{S.data.offset=0;S.data.action_offset=0;void loadData();}}
function setLetter(context,value){S.filters[context].initial_letter=Number(value);$$(`[data-alphabet="${context}"] button`).forEach(b=>{const selected=Number(b.dataset.letter)===Number(value);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});applyFilters(context);}
function resetFilter(context){S.filters[context]=freshFilter();if(context==='setup')S.filters.setup.requested_count=20;log('filter',context+':reset');if(context==='dictionary'){S.dictionary.offset=0;renderDictionary();void loadDictionary();}else if(context==='setup'){renderSetup();void loadCandidates();}else{S.data.offset=0;S.data.action_offset=0;renderData();void loadData();}}
function renderNav(){const active=key=>S.view===key?' current':'';$('#navContent').innerHTML=`<span class="eyebrow">CORE</span>${['hero','view_selection','dictionary','data','quiz_selection'].map(v=>`<button class="nav-button${active(v)}" data-nav="${v}" type="button">${esc(titles[v])}</button>`).join('')}<div class="eyebrow">QUIZ FORMATS</div>${['cloze','word_recall','reading_review'].map(q=>`<button class="nav-button" data-quiz="${q}" type="button">${esc(quizNames[q])}</button>`).join('')}<button class="nav-button${active('sentence_generation')}" data-nav="sentence_generation" type="button">Sentence Generation <span class="soon">Coming soon</span></button>${S.session?`<div class="session-shortcut"><span class="small-caption">CURRENT SESSION · ${esc(S.session.session_id)}</span><p class="fine">${esc(quizNames[S.session.quiz_type])} · ${num(S.session.answered)} / ${num(S.session.total)} answered</p><button type="button" class="btn small secondary" data-resume="${esc(S.session.session_id)}">Sessionに戻る ↗</button></div>`:''}<p class="fine">読む。練習する。振り返る。<br>対象も回数も、自分で選ぶ。</p>`;}
function setMenu(open){if(S.menu===open)return;S.menu=open;const drawer=$('#drawer'),backdrop=$('#backdrop');if(open){navFocus=document.activeElement;renderNav();drawer.hidden=false;backdrop.hidden=false;drawer.classList.add('show');backdrop.classList.add('show');drawer.setAttribute('aria-hidden','false');$('#appRoot').inert=true;$('#openMenu').setAttribute('aria-expanded','true');$('#closeMenu').focus();log('open','navigation');}else{drawer.classList.remove('show');backdrop.classList.remove('show');drawer.hidden=true;backdrop.hidden=true;drawer.setAttribute('aria-hidden','true');$('#appRoot').inert=false;$('#openMenu').setAttribute('aria-expanded','false');if(navFocus&&navFocus.isConnected)navFocus.focus();log('close','navigation');}}
function route(view,{hash=true,focus=true}={}){if(!titles[view])view='hero';if(isQuiz(view)&&!S.session)view='quiz_selection';setMenu(false);if(revealRelease)revealRelease();const old=S.view;if(old!==view){log('leave',null,null,old);if(isQuiz(old)&&!isQuiz(view)&&S.session&&S.session.status!=='completed'){const sid=S.session.session_id;void api('/api/sessions/'+sid,{status:'paused'},'PATCH').then(session=>{if(S.session?.session_id===sid)S.session.status=session.status;}).catch(()=>{});}S.view=view;routeVersion++;log('enter',null,null,view);void flushActions();}if(hash&&location.hash!==('#'+view))history.pushState({view},'', '#'+view);render();$('#topView').textContent=titles[view];document.title=titles[view]+' · Oxford Core Vocabulary';window.scrollTo(0,0);if(focus)main.focus({preventScroll:true});if(view==='dictionary')void loadDictionary();if(view==='data')void loadData();if(view==='submode_selection'){void loadCandidates();void loadSessions();}}
function selectQuiz(q){if(!quizNames[q])return;sessionOperation++;S.setup.starting=false;S.setup.quiz_type=q;S.setup.variant=variants[q][0]||null;S.setup.source_mode='new';S.setup.total=null;S.setup.error='';log('choose','quiz_type',q);route('submode_selection');}
function render(){if(S.view==='hero')renderHero();else if(S.view==='view_selection')renderViewSelection();else if(S.view==='quiz_selection')renderQuizSelection();else if(S.view==='submode_selection')renderSetup();else if(S.view==='dictionary')renderDictionary();else if(S.view==='data')renderData();else if(S.view==='sentence_generation')renderComing();else renderQuiz();}
function renderHero(){main.innerHTML=`<section class="hero centered"><div class="small-overline">YOUR PRIVATE LANGUAGE LAB</div><span class="hero-motif" aria-hidden="true">O.</span><h1>Words,<br><em>in context.</em></h1><p class="lead">語を探す。意味を捉える。何度でも、自分の意志で練習する。</p><form id="heroForm" class="hero-search"><label class="sr-only" for="quickSearch">語彙を検索</label><input id="quickSearch" type="search" placeholder="Search your vocabulary…" autocomplete="off"><button class="btn primary" type="submit">Search ↗</button></form><div class="hero-links"><button class="outline-link" type="button" data-nav="view_selection">Explore / View</button><button class="outline-link" type="button" data-nav="quiz_selection">Start / Quiz</button></div><span class="fine">${num(S.meta.count)} CORPUS RECORDS · PERSONAL LEARNING</span>${S.bootError?`<div class="spaced">${noticeError(S.bootError)}<button class="btn secondary" type="button" data-reconnect>再接続</button></div>`:''}</section>`;}
function renderViewSelection(){main.innerHTML=title('VIEW / SELECT','A place to look closer.','単語を読むか、学習の足跡を振り返るか。')+`<div class="choice-grid choice-duo"><button class="choice-card" data-nav="dictionary" type="button"><span class="choice-number">01 — EXPLORE</span><span class="choice-symbol" aria-hidden="true">Aa</span><h2>Dictionary</h2><p>WORD・EXAMPLE・JP。語彙を文脈とともに閲覧する。</p><span class="card-link">Open Dictionary ↗</span></button><button class="choice-card" data-nav="data" type="button"><span class="choice-number">02 — REFLECT</span><span class="choice-symbol" aria-hidden="true">↗</span><h2>Data</h2><p>回答履歴、確信度、操作時間を自分の視点で見返す。</p><span class="card-link">View learning data ↗</span></button></div>`;}
function renderQuizSelection(){const choices=[['cloze','C','空欄から文脈を復元する'],['word_recall','W','EN → JP / JP → EN の四択'],['reading_review','R','例文を読み、理解を自己評価'],['sentence_generation','S','Coming soon...']];main.innerHTML=title('QUIZ / CHOOSE A FORM','What would you like to practise?','学習形式を自分で選ぶ。出題数も、復習の時期も自分で決める。')+`<div class="choice-grid quiz-cards">${choices.map(([q,s,d],i)=>`<button class="choice-card" type="button" ${q==='sentence_generation'?'data-nav="sentence_generation"':`data-quiz="${q}"`}><span class="choice-number">0${i+1} / ${q}</span><span class="choice-symbol" aria-hidden="true">${s}</span><h2>${esc(quizNames[q]||'Sentence Generation')}</h2><p>${d}</p><span class="card-link">${q==='sentence_generation'?'Coming soon':'Select format ↗'}</span></button>`).join('')}</div>`;}
function renderComing(){main.innerHTML=`<section class="coming"><span class="eyebrow">QUIZ / SENTENCE GENERATION</span><div class="coming-symbol" aria-hidden="true">✳</div><h1>Words may become<br>sentences.</h1><p class="lead">Coming soon...</p><p class="fine">例文全体の対訳と評価方法を準備中です。</p><button class="btn secondary" type="button" data-nav="quiz_selection">← Back to Quiz</button></section>`;}
function renderSetup(){const q=S.setup,f=S.filters.setup;main.innerHTML=`<div class="submode-layout">${title('MODE / '+quizNames[q.quiz_type],'How shall we practise?','新しい問題を作るか、過去の問題に戻るか。')}<div class="mode-tabs" role="group" aria-label="出題モード"><button type="button" class="tab${q.source_mode==='new'?' active':''}" data-mode="new" aria-pressed="${q.source_mode==='new'}">NEW <span>新たな問題セット</span></button><button type="button" class="tab${q.source_mode==='review'?' active':''}" data-mode="review" aria-pressed="${q.source_mode==='review'}">Review <span>既存の問題を再演習</span></button></div><div class="setup-body"><div class="settings-card"><h2>Question settings</h2><div class="setting-grid"><label>Quiz type<select id="quizTypeSelect">${optionList(Object.keys(quizNames),q.quiz_type)}</select></label><label>方向 / Presentation<select id="variantSelect"${q.quiz_type==='cloze'?' disabled':''}>${variants[q.quiz_type].length?optionList(variants[q.quiz_type],q.variant):'<option value="">なし</option>'}</select></label><label>Questions<div class="number-setting"><input type="number" id="questionCount" min="1" max="100000" value="${f.requested_count===-1?20:f.requested_count}" aria-label="問題数"${f.requested_count===-1?' disabled':''}><span class="check"><input type="checkbox" id="allQuestions"${f.requested_count===-1?' checked':''}>全件</span></div></label></div></div>${filterPanel('setup',{history:q.source_mode==='review',compact:true})}<section class="panel" aria-label="出題する頭文字"><div class="panel-heading"><span class="eyebrow">INITIAL LETTER</span><span class="fine">学習する語の頭文字</span></div>${alphabet('setup')}</section>${q.source_mode==='review'?`<section class="review-extra"><h3>Resume Previous Session</h3><p class="fine">保存した問題順と回答を引き継いで再開します。</p><div id="resumeList" class="resume-list"></div></section>`:''}<div id="setupError">${noticeError(q.error)}</div><div class="actionbar setup-action"><button id="startSession" type="button" class="btn primary"${q.starting||!S.ready||(q.total===0&&!q.loading)?' disabled':''}>Start session ↗</button><span class="candidate-count" id="candidateCount"></span></div></div></div>`;paintCandidates();paintSessions();}
function setupFilter(){const f=structuredClone(S.filters.setup);if(S.setup.source_mode==='new'){f.history_result=[];f.confidence_range=null;f.attempt_time_range=null;}return f;}
function setupPayload(){return {quiz_type:S.setup.quiz_type,variant:S.setup.variant,source_mode:S.setup.source_mode,filter:setupFilter()};}
function paintCandidates(){const el=$('#candidateCount'),button=$('#startSession');if(!el)return;el.innerHTML=S.setup.loading?'対象を確認中…':S.setup.total===null?'条件に合う対象を確認します。':`<strong>${num(S.setup.total)}</strong> ${S.setup.source_mode==='review'?'questions':'records'} match${S.setup.cloze_skipped?` <span class="fine">· 空欄位置を特定できない ${num(S.setup.cloze_skipped)} 件を除外</span>`:''}`;if(button)button.disabled=!!S.setup.starting||!S.ready||(S.setup.total===0&&!S.setup.loading);}
async function loadCandidates(){const version=++candidateVersion;S.setup.loading=true;S.setup.error='';paintCandidates();try{await ensureReady();const payload=setupPayload();payload.filter.requested_count=-1;validateFilter(payload.filter);const r=await api('/api/candidates',payload);if(version!==candidateVersion)return;S.setup.total=r.total;S.setup.cloze_skipped=r.cloze_skipped||0;}catch(e){if(version!==candidateVersion)return;S.setup.error=e.message;S.setup.total=null;}finally{if(version===candidateVersion){S.setup.loading=false;if(S.view==='submode_selection'){paintCandidates();$('#setupError').innerHTML=noticeError(S.setup.error);}}}}
async function loadSessions(){try{await ensureReady();const type=S.setup.quiz_type,r=await api('/api/sessions?quiz_type='+encodeURIComponent(type));if(type!==S.setup.quiz_type)return;S.setup.sessions=r.items||[];if(S.view==='submode_selection')paintSessions();}catch(e){const el=$('#resumeList');if(el)el.innerHTML=noticeError(e.message);}}
function paintSessions(){const el=$('#resumeList');if(!el)return;const sessions=S.setup.sessions.filter(s=>s.quiz_type===S.setup.quiz_type&&s.status!=='completed');el.innerHTML=sessions.length?sessions.map(s=>`<div class="resume-row"><div><strong>Session ${esc(s.session_id)}</strong><p>${esc(variantNames[s.variant]||quizNames[s.quiz_type])} · ${num(s.answered)} / ${num(s.total)} answered</p><p>${esc(fmtDate(s.created_at))}</p></div><button type="button" class="btn secondary small" data-resume="${esc(s.session_id)}">Resume ↗</button></div>`).join(''):'<p class="fine">中断中のSessionはありません。</p>';}
async function startSession(){const button=$('#startSession');if(button?.disabled||S.setup.starting)return;const operation=++sessionOperation,epoch=routeVersion;try{readFilters('setup');const count=$('#allQuestions').checked?-1:Number($('#questionCount').value);if(count!==-1&&(!Number.isInteger(count)||count<1))throw new Error('問題数は1以上の整数を指定してください。');S.filters.setup.requested_count=count;const payload=setupPayload();validateFilter(payload.filter);const startAction=action('start',null,S.setup.source_mode);S.setup.starting=operation;if(button){button.disabled=true;button.textContent='Preparing…';}await ensureReady();if(operation!==sessionOperation)return;S.setup.error='';const created=await api('/api/sessions',{...payload,action:startAction});if(operation!==sessionOperation)return;S.session=created;S.question=null;S.draft=null;S.quizError='';S.quizLoading=false;log('created','session:'+created.session_id,created.source_mode);if(epoch!==routeVersion||S.view!=='submode_selection'){toast('Sessionを作成しました。メニューから再開できます。');return;}S.quizLoading=true;route(quizView(created.quiz_type));await loadQuestion(created.current_position||1);}catch(e){if(operation!==sessionOperation)return;S.setup.error=e.message;if(S.view==='submode_selection'&&epoch===routeVersion){const err=$('#setupError');if(err)err.innerHTML=noticeError(e.message);}}finally{if(S.setup.starting===operation)S.setup.starting=false;if(button&&button.isConnected){button.textContent='Start session ↗';paintCandidates();}}}
async function resumeSession(id){const operation=++sessionOperation;setMenu(false);const epoch=routeVersion;try{await ensureReady();let session=await api('/api/sessions/'+id);if(operation!==sessionOperation||epoch!==routeVersion)return;if(session.status!=='completed')session=await api('/api/sessions/'+id,{status:'active'},'PATCH');if(operation!==sessionOperation||epoch!==routeVersion)return;S.session=session;S.question=null;S.draft=null;S.quizError='';S.quizLoading=true;log('resume','session:'+id);route(quizView(session.quiz_type));await loadQuestion(session.current_position||1);}catch(e){if(operation!==sessionOperation||epoch!==routeVersion)return;toast(e.message);S.quizLoading=false;if(isQuiz())renderQuiz();}}
function renderDictionary(){main.innerHTML=title('VIEW / DICTIONARY','Words in context.','英文を先に読み、日本語は必要なときだけ開く。','<button class="btn secondary small" type="button" data-manage-collections>Collections ↗</button>')+`<div class="dictionary-layout"><aside>${filterPanel('dictionary')}</aside><div class="dictionary-main"><div class="alphabet-panel">${alphabet('dictionary')}</div><div class="result-bar"><span id="resultCount">読み込み中…</span><label class="check"><input id="showJP" type="checkbox"${S.dictionary.jp?' checked':''}>日本語をすべて表示</label></div><div id="dictionaryResults"></div></div></div>`;paintDictionary();}
async function loadDictionary(){const version=++dictVersion;S.dictionary.loading=true;S.dictionary.error='';const counter=$('#resultCount');if(counter)counter.textContent='検索中…';try{await ensureReady();validateFilter(S.filters.dictionary);const d=S.dictionary,r=await api('/api/search',{filter:S.filters.dictionary,offset:d.offset,limit:d.limit});if(version!==dictVersion)return;d.items=r.items||[];d.total=r.total;d.offset=r.offset;d.focus=0;}catch(e){if(version!==dictVersion)return;S.dictionary.error=e.message;}finally{if(version===dictVersion){S.dictionary.loading=false;if(S.view==='dictionary')paintDictionary();}}}
function paintDictionary(){const el=$('#dictionaryResults'),counter=$('#resultCount'),d=S.dictionary;if(!el)return;if(counter)counter.textContent=d.loading?'検索中…':`${num(d.total)} records${d.total?' · '+num(d.offset+1)+'–'+num(Math.min(d.offset+d.limit,d.total)):''}`;if(d.error){el.innerHTML=noticeError(d.error)+'<button class="btn secondary" type="button" data-reload-dictionary>再試行</button>';return;}if(d.loading&&!d.items.length){el.innerHTML='<div class="loader">Corpusを読み込んでいます…</div>';return;}if(!d.items.length){el.innerHTML=empty('一致する語がありません。','検索語やフィルターを変更してください。');return;}el.innerHTML=`<div class="word-list">${d.items.map((r,i)=>`<article class="word-card" tabindex="-1" data-corpus-card="${r.id}" data-card-index="${i}"><div class="word-meta"><div><h3>${esc(r.word)}</h3><span class="subtle"><span class="word-id">#${r.id}</span>${esc(r.pos)} · ${esc(r.level||'LEVEL —')}${r.section?' · '+esc(r.section):''}</span></div><button class="save" type="button" data-save-corpus="${r.id}" aria-label="${esc(r.word)}をCollectionへ保存">＋ 保存</button></div><p class="example">${esc(r.example)}</p><div class="meaning-actions"><details class="jp-details" data-meaning="${r.id}"${d.jp||d.revealed.has(r.id)?' open':''}><summary>日本語の意味を表示</summary><div class="meaning-text">${esc(r.jp)}</div></details><button class="press-reveal" type="button" data-hold="corpus-${r.id}" aria-label="押している間だけ${esc(r.word)}の日本語を表示">Hold to reveal</button></div><div class="temporary-jp" data-reveal-content="corpus-${r.id}" hidden>${esc(r.jp)}</div></article>`).join('')}</div>${pagination('dictionary',d.offset,d.limit,d.total)}`;}
function pagination(context,offset,limit,total){if(total===0)return '';return `<div class="pagination"><button class="btn small" type="button" data-page="${context}" data-offset="${Math.max(0,offset-limit)}"${offset===0?' disabled':''}>← Previous</button><span>${Math.floor(offset/limit)+1} / ${Math.max(1,Math.ceil(total/limit))}</span><button class="btn small" type="button" data-page="${context}" data-offset="${offset+limit}"${offset+limit>=total?' disabled':''}>Next →</button></div>`;}
function dataVariantOptions(){return S.data.quiz_type?variants[S.data.quiz_type]||[]:Object.keys(variantNames);}
function renderData(){main.innerHTML=title('VIEW / DATA','A record of your learning.','履歴は評価ではなく、振り返るための記録。','<button class="btn secondary small" type="button" data-refresh-data>Refresh ↻</button>')+`<div id="dataMetrics"></div><details class="data-filter-container" id="dataFilterDetails"${S.data.filtersOpen?' open':''}><summary>Filter records · 回答履歴の絞り込み</summary>${filterPanel('data',{history:true,compact:true})}<div class="data-extra-filters"><label class="field-label">Quiz type<select id="dataQuizType">${optionList(Object.keys(quizNames),S.data.quiz_type,'すべてのQuiz')}</select></label><label class="field-label">方向 / Presentation<select id="dataVariant">${optionList(dataVariantOptions(),S.data.variant,'すべての形式')}</select></label></div></details><div id="dataError">${noticeError(S.data.error)}</div><div class="data-layout"><section class="panel"><div class="data-tabs" role="group" aria-label="履歴の種類"><button type="button" class="${S.data.tab==='attempts'?'active':''}" data-data-tab="attempts" aria-pressed="${S.data.tab==='attempts'}">回答履歴</button><button type="button" class="${S.data.tab==='actions'?'active':''}" data-data-tab="actions" aria-pressed="${S.data.tab==='actions'}">操作履歴</button></div><div id="dataHistory"></div></section><aside class="panel" id="dataUsage"></aside></div>`;paintData();}
async function loadData(){const version=++dataVersion;S.data.loading=true;S.data.error='';try{await ensureReady();validateFilter(S.filters.data);await flushActions();const d=S.data,r=await api('/api/data',{filter:S.filters.data,quiz_type:d.quiz_type,variant:d.variant,offset:d.offset,limit:d.limit,action_offset:d.action_offset,action_limit:d.action_limit,screen:d.screen,event:d.event});if(version!==dataVersion)return;d.records=r;}catch(e){if(version!==dataVersion)return;S.data.error=e.message;}finally{if(version===dataVersion){S.data.loading=false;if(S.view==='data'){paintData();$('#dataError').innerHTML=noticeError(S.data.error);}}}}
function resultLabel(a){if(a.outcome==='unknown')return ['Unknown',''];if(a.correct===1||a.correct===true)return ['Correct','good'];if(a.correct===0||a.correct===false)return ['Incorrect','bad'];if(a.recalled===1||a.recalled===true)return ['自己評価：できた','good'];if(a.recalled===0||a.recalled===false)return ['自己評価：できなかった',''];return ['未評価',''];}
function paintData(){const metrics=$('#dataMetrics'),history=$('#dataHistory'),usage=$('#dataUsage'),d=S.data,r=d.records;if(!metrics||!history||!usage)return;const st=r?.stats,u=r?.usage;metrics.innerHTML=`<div class="metric-grid"><div class="metric"><span>ATTEMPTS</span><strong>${st?num(st.attempts):'—'}</strong><small>確定した回答</small></div><div class="metric"><span>ACCURACY</span><strong>${st?.accuracy==null?'—':Number(st.accuracy).toFixed(1)+'<span class="number-unit">%</span>'}</strong><small>客観問題のみ</small></div><div class="metric"><span>UNKNOWN</span><strong>${st?num(st.unknown):'—'}</strong><small>明示した「分からない」</small></div><div class="metric"><span>TIME · APPROX.</span><strong>${u?esc(fmtDuration(u.total_ms)):'—'}</strong><small>開始・終了が揃う区間の概算</small></div></div><div class="metric-note"><span>Incorrect ${st?num(st.incorrect):'—'}</span><span>Reading できた ${st?num(st.reading_yes):'—'} / できなかった ${st?num(st.reading_no):'—'}</span><span>平均Confidence ${st?.confidence_average==null?'—':Number(st.confidence_average).toFixed(1)}</span></div>`;if(!r){history.innerHTML='<div class="loader">履歴を読み込んでいます…</div>';usage.innerHTML='<h2>Time by view</h2><p class="fine">記録を確認中…</p>';return;}if(d.tab==='attempts'){history.innerHTML=`<div class="result-bar"><span>${num(r.total)} attempts${d.loading?' · 更新中…':''}</span><span class="fine">日時は端末の現地時間</span></div>${r.attempts.length?r.attempts.map(a=>{const label=resultLabel(a),date=fmtShortDate(a.occurred_at),c=a.corpus||{};return `<details class="history-entry"><summary><time class="entry-time" datetime="${a.occurred_at?new Date(a.occurred_at).toISOString():''}">${esc(date[0])}<br>${esc(date[1])}</time><span class="entry-main"><strong>${esc(c.word||'#'+a.question_id)}</strong><span class="result-tag ${label[1]}">${label[0]}</span><small>${esc(quizNames[a.quiz_type])}${a.variant?' · '+esc(variantNames[a.variant]||a.variant):''}</small></span><span class="entry-confidence">${a.confidence==null?'—':a.confidence}<small>Confidence</small></span></summary><div class="entry-detail"><p class="example">${esc(c.example||'')}</p><p>${esc(c.jp||'')} · ${esc(c.pos||'')} · ${esc(c.level||'LEVEL —')}</p><dl><dt>Attempt</dt><dd>${esc(a.attempt_id)}</dd><dt>Session / Position</dt><dd>${esc(a.session_id)} / ${a.position}</dd><dt>Question / Corpus</dt><dd>${esc(a.question_id)} / ${c.id??'—'}</dd><dt>回答</dt><dd>${a.outcome==='unknown'?'Unknown':a.answer_text!=null?esc(a.answer_text):a.selected_corpus_id!=null?'Corpus #'+a.selected_corpus_id:a.recalled===1?'できた':a.recalled===0?'できなかった':'—'}</dd><dt>Confidence</dt><dd>${a.confidence==null?'未設定':a.confidence+' / 100'}</dd><dt>回答所要時間</dt><dd>${a.response_time_ms==null?'不明':esc(fmtDuration(a.response_time_ms))}</dd><dt>客観的正誤</dt><dd>${a.correct==null?'対象外（自己評価）':a.correct===1?'Correct':'Incorrect'}</dd></dl><button type="button" class="btn secondary small" data-resume="${esc(a.session_id)}">このSessionを見る ↗</button></div></details>`;}).join(''):empty('回答の記録はありません。','条件を変えるか、Quizを始めてください。')}${pagination('data',d.offset,d.limit,r.total)}`;}else{const screens=Object.keys(titles);const events=['enter','leave','visible','hidden','search','filter','choose','confidence','submit','unknown','reveal','hide','next','previous','session_start','created','resume','repeat','page','open','close','activity_start','create','add','remove','delete'];history.innerHTML=`<div class="action-controls"><label class="field-label">画面<select id="actionScreen">${optionList(screens,d.screen,'すべての画面')}</select></label><label class="field-label">操作<select id="actionEvent">${optionList(events,d.event,'すべての操作')}</select></label></div><p class="fine">操作履歴は画面・操作・日時で絞り込みます。</p><div class="result-bar"><span>${num(r.action_total)} actions${d.loading?' · 更新中…':''}</span></div>${r.actions.length?r.actions.map(a=>`<article class="action-entry"><div class="action-title"><strong>${esc(a.event)} <span class="muted">· ${esc(titles[a.screen]||a.screen)}</span></strong><time>${esc(fmtDate(a.occurred_at))}</time></div>${a.target?`<div>${esc(a.target)}</div>`:''}${a.value!=null?`<div class="action-value">${esc(a.value)}</div>`:''}<small>Action ${esc(a.action_id)} · Activity ${esc(a.activity_id)}${a.session_id?' · Session '+esc(a.session_id):''}${a.attempt_id?' · Attempt '+esc(a.attempt_id):''}</small></article>`).join(''):empty('一致する操作はありません。')}${pagination('actions',d.action_offset,d.action_limit,r.action_total)}`;}usage.innerHTML=`<div class="panel-heading"><h2>Time by view</h2><span class="fine">APPROX.</span></div>${u?.by_screen?.length?u.by_screen.map(v=>`<div class="usage-row"><span>${esc(titles[v.screen]||v.screen)}</span><strong>${esc(fmtDuration(v.duration_ms))}</strong></div>`).join(''):'<p class="fine spaced">開始・終了が揃う区間はまだありません。</p>'}<p class="usage-note">画面に入ってから離れるまでの概算です。読んでいる間の無操作時間も含みます。</p>${u?.unknown_intervals?`<p class="usage-warning">終了時刻が不明：${num(u.unknown_intervals)} 区間<br>不明な区間は時間に加算していません。</p>`:'<p class="fine spaced">不明な区間：0</p>'}`;}
function makeDraft(q){const a=q.latest_attempt;return {selected_corpus_id:a?.selected_corpus_id??null,answer_text:a?.answer_text??'',recalled:a?.recalled??null,confidence:a?.confidence??null,saved:a||null,feedback:q.feedback||null,pending:false,started:performance.now(),checkAfterFailure:false};}
async function loadQuestion(position){if(!S.session)return;const version=++questionVersion,sid=S.session.session_id;S.quizLoading=true;S.quizError='';try{const q=await api('/api/sessions/'+sid+'/questions/'+position);if(version!==questionVersion||S.session?.session_id!==sid)return;S.question=q;S.draft=makeDraft(q);S.session.current_position=position;S.quizLoading=false;if(isQuiz())renderQuiz();}catch(e){if(version!==questionVersion)return;S.quizLoading=false;S.quizError=e.message;if(isQuiz())renderQuiz();}}
function confidenceHTML(){const d=S.draft,locked=!!d.saved||d.pending;return `<div class="confidence-area${d.confidence==null?' unset':''}"><div class="range-label"><label for="confidence" class="fieldname">Confidence</label><strong id="confidenceValue">${d.confidence==null?'未設定':d.confidence+' / 100'}</strong><button type="button" class="linklike reset-confidence" data-reset-confidence${locked?' disabled':''}>未設定に戻す</button></div><input id="confidence" type="range" min="0" max="100" step="1" value="${d.confidence??50}" aria-label="Confidence"${locked?' disabled':''}><div class="range-ends"><span>0 · 確信なし</span><span>100 · 確信あり</span></div><span class="fine">${d.saved?'回答時の確信度を保存済み':'正答を開く前に設定。操作しなければ未設定のまま保存します。'}</span></div>`;}
function feedbackHTML(){const d=S.draft;if(!d?.saved)return '';const a=d.saved,f=d.feedback||{},label=resultLabel(a),q=S.question;let content='';if(q.quiz_type==='word_recall')content=(f.options||[]).map(c=>`<div class="answer-mapping"><div class="mapping-header"><b>${esc(c.word)}</b><span>${esc(c.pos)}</span>${Number(c.id)===Number(f.correct_corpus_id)?'<span class="answer-label">正答</span>':''}${Number(c.id)===Number(a.selected_corpus_id)?'<span class="selected-label">あなたの選択</span>':''}</div><span class="mapping-meaning">${esc(c.jp)}</span><details><summary>例文を見る</summary><p>${esc(c.example)}</p></details></div>`).join('');else if(q.quiz_type==='cloze')content=`<p class="spaced">Expected answer: <strong>${esc(f.expected_answer)}</strong></p><p>${esc(q.corpus.example)}</p><p class="fine">${esc(q.corpus.word)} · ${esc(q.corpus.pos)} · ${esc(q.corpus.jp)}</p>${a.answer_text!=null?`<p class="fine">Your answer: ${esc(a.answer_text)}</p>`:''}`;else content=`<p class="spaced"><strong>${esc(q.corpus.word)}</strong> · ${esc(q.corpus.jp)}</p><p class="fine">理解できたかの自己評価です。客観的な正誤は記録しません。</p>`;return `<section class="feedback ${label[1]}" aria-label="保存した回答"><div class="feedback-title"><strong>${label[0]}</strong><span class="fine">✓ 保存済み · Attempt ${esc(a.attempt_id)}</span></div><div class="fine">${esc(fmtDate(a.occurred_at))} · Confidence ${a.confidence==null?'未設定':a.confidence+' / 100'}</div>${content}</section>`;}
function quizStatusHTML(){const s=S.session,q=S.question;return `<div class="quiz-status"><span class="eyebrow">${esc(quizNames[s.quiz_type])} / ${esc(s.source_mode.toUpperCase())}${s.variant?' · '+esc(variantNames[s.variant]||s.variant):''}</span><span class="position">${q.position} / ${num(s.total)}</span></div><div class="progress-track" role="progressbar" aria-label="回答済みの問題" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.answered}"><span style="width:${s.total?Math.round(s.answered/s.total*100):0}%"></span></div>`;}
function navQuestionsHTML(){const s=S.session,q=S.question,disabled=S.draft.pending||S.quizLoading;return `<div class="quiz-footer"><button class="btn" type="button" data-question-move="-1"${q.position<=1||disabled?' disabled':''}>← Previous</button><div class="nav-middle"><label class="sr-only" for="questionJump">問題へ移動</label><select id="questionJump"${disabled?' disabled':''}>${s.questions.map(p=>`<option value="${p.position}"${p.position===q.position?' selected':''}>${p.position} / ${s.total}${p.answered?' ✓':''}</option>`).join('')}</select><span class="fine">${num(s.answered)} answered</span></div><button class="btn" type="button" data-question-move="1"${q.position>=s.total||disabled?' disabled':''}>Next →</button></div>`;}
function quizButtonsHTML(){const d=S.draft;if(d.saved)return `<div class="quiz-actions"><button type="button" class="btn secondary" data-repeat>もう一度回答する</button>${S.question.position<S.session.total?'<button type="button" class="btn primary" data-question-move="1">Next question →</button>':'<button type="button" class="btn primary" data-nav="data">View learning data ↗</button>'}</div>`;return `<div class="quiz-actions"><button type="button" class="btn secondary" id="unknown"${d.pending?' disabled':''}>Unknown</button><button type="button" class="btn primary" id="submitAnswer"${d.pending?' disabled':''}>${d.pending?'Saving…':'Submit answer ↗'}</button></div>${d.checkAfterFailure?'<div class="notice spaced">保存結果を確認してから、再送してください。<button type="button" class="linklike" data-check-answer>記録を確認</button></div>':''}`;}
function quizToolsHTML(){return `<div class="quiz-tools"><details class="input-help"><summary>入力・ショートカット</summary><p>四択：<kbd>1–4</kbd> / <kbd>A B X Y</kbd> · 回答確定：<kbd>Enter</kbd> · Unknown：<kbd>U</kbd><br>前後移動：<kbd>← →</kbd>（Readingでは自己評価）· Reading自己評価：左＝できなかった、右＝できた。<br>意味の一時表示：<kbd>Space</kbd>を押している間（Reading）<br>PCゲームパッド：ABXY＝四択、LB/RB＝前後、LT/RT＝Confidence、R3＝確定。ReadingではX/Y＝自己評価、A＝意味表示。スティックでフォーカス／確信度を調整。</p></details><button class="btn secondary small" type="button" data-save-question="${esc(S.question.question_id)}">＋ 問題を保存</button></div>`;}
function renderQuiz(){const s=S.session;if(!s){route('quiz_selection');return;}const q=S.question,d=S.draft;const heading=s.quiz_type==='word_recall'?'Recall the meaning.':s.quiz_type==='cloze'?'Find the missing words.':'Read. Understand. Decide.';let top=title('QUIZ / '+quizNames[s.quiz_type],heading,s.quiz_type==='reading_review'?'例文を読み、意味を自分の中で復元できたか。':'');if(S.quizLoading||!q||!d){main.innerHTML=top+noticeError(S.quizError)+`<div class="quiz-surface focus"><div class="loader">${S.quizError?'問題を取得できませんでした。':'問題を読み込んでいます…'}</div>${S.quizError?'<button class="btn secondary full" type="button" data-check-answer>再取得</button>':''}</div>`;return;}if(s.status==='completed')top+=`<div class="complete-banner"><div><strong>Session completed</strong><p>${num(s.total)}問すべての回答を保存しました。</p></div><button type="button" class="btn small" data-nav="quiz_selection">次の練習へ ↗</button></div>`;const error=`<div id="quizError" class="quiz-error">${noticeError(S.quizError)}</div>`;if(s.quiz_type==='reading_review'){main.innerHTML=top+`<div class="reader-stage">${quizStatusHTML()}<article class="reading-card${d.recalled===1?' rated-yes':d.recalled===0?' rated-no':''}" id="readingCard" tabindex="0" aria-label="Reading Reviewカード"><span class="swipe-indicator no" aria-hidden="true">できなかった</span><span class="swipe-indicator yes" aria-hidden="true">できた</span><span class="eyebrow">IN CONTEXT</span><h2>${esc(q.prompt)}</h2><p class="reading-sentence">${esc(q.corpus.example)}</p>${q.variant==='word_and_example'&&!d.saved?`<button class="press-reveal" type="button" data-hold="reading">Hold to reveal Japanese</button><p class="revealed-jp" data-reveal-content="reading" hidden>${esc(q.corpus.jp)}</p>`:''}</article>${d.saved?'':`<div class="swipe-actions"><button class="btn negative${d.recalled===0?' selected':''}" type="button" data-recalled="0" aria-pressed="${d.recalled===0}"${d.pending?' disabled':''}>← できなかった</button><button class="btn positive${d.recalled===1?' selected':''}" type="button" data-recalled="1" aria-pressed="${d.recalled===1}"${d.pending?' disabled':''}>できた →</button></div><p class="fine center spaced" id="swipeFeedback">${d.recalled==null?'左右スワイプ／ボタンで選択し、回答を確定してください。':d.recalled===1?'「できた」を選択中 · まだ未確定':'「できなかった」を選択中 · まだ未確定'}</p>`}${confidenceHTML()}${feedbackHTML()}${error}${quizButtonsHTML()}${navQuestionsHTML()}${quizToolsHTML()}</div>`;}else{const body=s.quiz_type==='word_recall'?`<div class="recall-word" data-quiz-swipe><span class="eyebrow">${s.variant==='jp_to_en'?'CHOOSE THE MATCHING WORD':'CHOOSE THE MATCHING MEANING'}</span><h2>${esc(q.prompt)}</h2><span class="subtle">${esc(q.corpus.pos)} · ${esc(q.corpus.level?'Oxford '+q.corpus.level:'LEVEL —')}</span></div><div class="answers vertical">${q.options.map((o,i)=>`<button class="answer-choice${d.selected_corpus_id===o.id?' selected':''}${d.saved&&Number(d.feedback?.correct_corpus_id)===Number(o.id)?' right-answer':''}${d.saved&&d.selected_corpus_id===o.id&&d.saved.correct===0?' wrong-answer':''}" type="button" data-answer-id="${o.id}" data-answer-index="${i}" aria-pressed="${d.selected_corpus_id===o.id}"${d.saved||d.pending?' disabled':''}><kbd>${['A','B','X','Y'][i]}</kbd><span>${esc(o.label)}</span></button>`).join('')}</div>`:`<div class="question-content" data-quiz-swipe><span class="eyebrow">FILL THE MISSING TEXT</span><p class="quiz-sentence">${esc(q.cloze_text||q.prompt).replace(/_{2,}/g,t=>'<span class="blank-placeholder">'+t+'</span>')}</p><label class="fieldname" for="clozeAnswer">Your answer</label><input class="answer-input" id="clozeAnswer" type="text" placeholder="Type the missing text…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d.answer_text)}"${d.saved||d.pending?' disabled':''}></div>`;main.innerHTML=top+`<div class="quiz-surface focus">${quizStatusHTML()}${body}${confidenceHTML()}${feedbackHTML()}${error}${quizButtonsHTML()}${navQuestionsHTML()}${quizToolsHTML()}</div>`;}}
function paintConfidence(){if(!S.draft)return;const d=S.draft,value=$('#confidenceValue'),area=$('.confidence-area'),range=$('#confidence');if(value)value.textContent=d.confidence==null?'未設定':d.confidence+' / 100';if(area)area.classList.toggle('unset',d.confidence==null);if(range&&Number(range.value)!==d.confidence)range.value=d.confidence??50;}
function setConfidence(value,commit=false){if(!S.draft||S.draft.saved||S.draft.pending)return;S.draft.confidence=value===null?null:Math.max(0,Math.min(100,Math.round(Number(value))));paintConfidence();if(commit)log('confidence',targetQuestion(),S.draft.confidence===null?'unset':S.draft.confidence);}
function chooseAnswer(id){if(!S.draft||S.draft.saved||S.draft.pending)return;S.draft.selected_corpus_id=Number(id);$$('[data-answer-id]').forEach(b=>{const selected=Number(b.dataset.answerId)===Number(id);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});log('choose',targetQuestion(),id);}
function rateReading(value){if(!S.draft||S.draft.saved||S.draft.pending||S.question?.quiz_type!=='reading_review')return;S.draft.recalled=Number(value);$$('[data-recalled]').forEach(b=>{const selected=Number(b.dataset.recalled)===Number(value);b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});const card=$('#readingCard');if(card){card.classList.toggle('rated-yes',Number(value)===1);card.classList.toggle('rated-no',Number(value)===0);}const feedback=$('#swipeFeedback');if(feedback)feedback.textContent=(Number(value)===1?'「できた」':'「できなかった」')+'を選択中 · まだ未確定';log('choose',targetQuestion(),Number(value)===1?'recalled:1':'recalled:0');}
async function submitAttempt(unknown=false){const d=S.draft,q=S.question,s=S.session;if(!d||!q||!s||d.saved||d.pending)return;if(d.checkAfterFailure){toast('先に「記録を確認」で保存結果を確認してください。');return;}if(!unknown){if(q.quiz_type==='word_recall'&&d.selected_corpus_id==null){toast('選択肢を選ぶか、Unknownを選んでください。');return;}if(q.quiz_type==='cloze'&&!d.answer_text.trim()){toast('空欄に入る語句を入力するか、Unknownを選んでください。');$('#clozeAnswer')?.focus();return;}if(q.quiz_type==='reading_review'&&d.recalled==null){toast('「できた」か「できなかった」を選んでください。');return;}}const occurred=action(unknown?'unknown':'submit',targetQuestion());const payload={position:q.position,outcome:unknown?'unknown':'answered',selected_corpus_id:!unknown&&q.quiz_type==='word_recall'?d.selected_corpus_id:null,answer_text:!unknown&&q.quiz_type==='cloze'?d.answer_text:null,recalled:!unknown&&q.quiz_type==='reading_review'?d.recalled:null,confidence:d.confidence,response_time_ms:Math.max(0,Math.round(performance.now()-d.started)),action:occurred};d.pending=true;S.quizError='';renderQuiz();void flushActions();try{const r=await api('/api/sessions/'+s.session_id+'/attempts',payload);if(S.draft!==d||S.session?.session_id!==s.session_id||S.question?.position!==q.position){toast('回答を保存しました。');return;}S.session=r.session;d.saved=r.attempt;d.feedback=r.feedback;d.selected_corpus_id=r.attempt.selected_corpus_id??null;d.answer_text=r.attempt.answer_text??'';d.recalled=r.attempt.recalled??null;d.confidence=r.attempt.confidence??null;d.pending=false;q.latest_attempt=r.attempt;q.feedback=r.feedback;S.draft=d;S.quizError='';if(isQuiz())renderQuiz();}catch(e){d.pending=false;if(S.draft!==d||S.session?.session_id!==s.session_id||S.question?.position!==q.position)return;d.checkAfterFailure=!!e.network||!e.status||e.status>=500;S.quizError=e.message;if(isQuiz())renderQuiz();}}
async function checkAnswer(){if(!S.session)return;const sid=S.session.session_id,position=S.question?.position||S.session.current_position||1,operation=++sessionOperation,epoch=routeVersion;try{const s=await api('/api/sessions/'+sid);if(operation!==sessionOperation||epoch!==routeVersion||S.session?.session_id!==sid)return;S.session=s;await loadQuestion(position);}catch(e){if(operation===sessionOperation)toast(e.message);}}
function repeatQuestion(){if(!S.question||S.draft?.pending)return;S.draft={selected_corpus_id:null,answer_text:'',recalled:null,confidence:null,saved:null,feedback:null,pending:false,started:performance.now(),checkAfterFailure:false};S.quizError='';log('repeat',targetQuestion());renderQuiz();}
async function moveQuestion(position){if(!S.session||!S.question||S.draft?.pending||S.quizLoading)return;const next=Number(position);if(!Number.isInteger(next)||next<1||next>S.session.total||next===S.question.position)return;const direction=next>S.question.position?'next':'previous',sid=S.session.session_id,operation=++sessionOperation,epoch=routeVersion,view=S.view;S.quizLoading=true;log(direction,targetQuestion(),next);try{const updated=await api('/api/sessions/'+sid,{current_position:next},'PATCH');if(operation!==sessionOperation||S.session?.session_id!==sid)return;S.session=updated;if(epoch!==routeVersion||S.view!==view||!isQuiz()){S.quizLoading=false;return;}S.question=null;S.draft=null;renderQuiz();await loadQuestion(next);}catch(e){if(operation!==sessionOperation)return;S.quizLoading=false;S.quizError=e.message;if(epoch===routeVersion&&S.view===view&&isQuiz())renderQuiz();}}
async function refreshCollections(){const r=await api('/api/collections');S.collections=r.items||[];return S.collections;}
async function openCollections(target=null){if(['dictionary','submode_selection','data'].includes(S.view))readFilters(S.view==='submode_selection'?'setup':S.view);setMenu(false);S.collectionPanel={target,detail:null,page:0,duplicate:null,error:'',busy:false,deleteConfirm:null};const dialog=$('#collectionDialog');$('#collectionBody').innerHTML='<div class="loader">Collectionを読み込んでいます…</div>';if(!dialog.open)dialog.showModal();log('open','collections');try{await ensureReady();await refreshCollections();renderCollections();}catch(e){S.collectionPanel.error=e.message;renderCollections();}}
function closeCollections(){if(!$('#collectionDialog').open)return;$('#collectionDialog').close();log('close','collections');S.collectionPanel=null;if(S.view==='dictionary'){readFilters('dictionary');renderDictionary();void loadDictionary();}else if(S.view==='submode_selection'){readFilters('setup');renderSetup();void loadCandidates();}else if(S.view==='data'){readFilters('data');renderData();void loadData();}}

stion '+esc(p.target.question_id)}を保存します。</div>`:'<p class="lead">語彙や問題を、自分の学習対象としてまとめて保存します。</p>'}${err}<div class="collection-list">${eligible.length?eligible.map(c=>`<div class="collection-row"><div><div class="collection-name">${esc(c.name)}</div><div class="fine">${esc(c.kind)} · ${num(c.count)} items</div></div><div class="collection-buttons"><button class="btn small" type="button" data-view-collection="${esc(c.collection_id)}">開く</button>${p.target?`<button class="btn primary small" type="button" data-add-collection="${esc(c.collection_id)}"${p.busy?' disabled':''}>保存</button>`:''}</div></div>`).join(''):'<p class="fine">Collectionはまだありません。下で新しく作れます。</p>'}</div>${p.duplicate?`<div class="collection-warning" role="alert"><p>このIDはすでに登録されています。重複して追加すると、練習の対象にその回数分含まれます。</p><button class="btn primary small" type="button" data-confirm-duplicate="${esc(p.duplicate)}"${p.busy?' disabled':''}>重複して追加</button><button class="btn small" type="button" data-cancel-collection-warning>キャンセル</button></div>`:''}<form class="collection-create" id="createCollectionForm"><label class="sr-only" for="collectionName">Collection名</label><input id="collectionName" type="text" placeholder="New collection name" maxlength="120" required autocomplete="off"><label class="sr-only" for="collectionKind">保存する種類</label><select id="collectionKind"${p.target?' disabled':''}><option value="vocabulary"${p.target?.kind==='question'?'':' selected'}>Vocabulary</option><option value="question"${p.target?.kind==='question'?' selected':''}>Question</option></select><button class="btn secondary" type="submit"${p.busy?' disabled':''}>${p.target?'新規作成して保存':'Create'}</button></form><p class="fine">Vocabulary＝語彙を保存。Question＝候補や空欄を含む、作成済みの問題を保存。</p>`;}
async function viewCollection(id){const p=S.collectionPanel;if(!p)return;try{p.detail=await api('/api/collections/'+id);p.page=0;p.error='';p.deleteConfirm=null;renderCollections();}catch(e){p.error=e.message;renderCollections();}}
async function addCollection(id,allowDuplicate=false){const p=S.collectionPanel;if(!p?.target||p.busy)return;p.busy=true;p.error='';const body=p.target.kind==='vocabulary'?{corpus_id:p.target.corpus_id}:{question_id:p.target.question_id};try{await api('/api/collections/'+id+'/items',{...body,allow_duplicate:allowDuplicate,action:action('add','collection:'+id,p.target.kind==='vocabulary'?'corpus:'+id8(p.target.corpus_id):'question:'+p.target.question_id)});p.duplicate=null;await refreshCollections();toast('Collectionに保存しました。');}catch(e){if(e.status===409&&e.code==='duplicate')p.duplicate=id;else p.error=e.message;}finally{p.busy=false;renderCollections();}}
async function createCollection(){const p=S.collectionPanel;if(!p||p.busy)return;const name=$('#collectionName').value.trim(),kind=p.target?.kind||$('#collectionKind').value;if(!name){$('#collectionName').focus();return;}p.busy=true;p.error='';try{const c=await api('/api/collections',{name,kind,action:action('create','collection',name)});await refreshCollections();p.busy=false;if(p.target){await addCollection(c.collection_id);return;}toast('Collectionを作成しました。');}catch(e){p.error=e.message;}finally{p.busy=false;renderCollections();}}
async function deleteCollectionItem(itemId){const p=S.collectionPanel;if(!p?.detail||p.busy)return;p.busy=true;try{const id=p.detail.collection_id;await api('/api/collections/'+id+'/items/'+itemId,{action:action('remove','collection:'+id,'item:'+itemId)},'DELETE');p.detail=await api('/api/collections/'+id);p.page=Math.min(p.page,Math.max(0,Math.ceil(p.detail.items.length/25)-1));await refreshCollections();p.error='';toast('登録項目を削除しました。');}catch(e){p.error=e.message;}finally{p.busy=false;renderCollections();}}
async function deleteCollection(){const p=S.collectionPanel;if(!p?.deleteConfirm||p.busy)return;p.busy=true;try{const id=p.deleteConfirm;await api('/api/collections/'+id,{action:action('remove','collection:'+id)},'DELETE');for(const f of Object.values(S.filters))f.collection_ids=f.collection_ids.filter(v=>v!==id);await refreshCollections();p.detail=null;p.deleteConfirm=null;p.error='';toast('Collectionを削除しました。');}catch(e){p.error=e.message;}finally{p.busy=false;renderCollections();}}
function holdReveal(name){if(revealRelease)revealRelease();const el=$(`[data-reveal-content="${name}"]`);if(!el)return;el.hidden=false;const target=name==='reading'?targetQuestion():'corpus:'+id8(name.split('-')[1]);log('reveal',target,'hold');let released=false;revealRelease=()=>{if(released)return;released=true;el.hidden=true;log('hide',target,'hold');revealRelease=null;};}
function releaseReveal(){if(revealRelease)revealRelease();}
function dispatch(actionName,value){if(actionName==='CHOOSE')chooseAnswer(value);else if(actionName==='RATE')rateReading(value);else if(actionName==='SUBMIT')void submitAttempt(false);else if(actionName==='UNKNOWN')void submitAttempt(true);else if(actionName==='NEXT')void moveQuestion((S.question?.position||0)+1);else if(actionName==='PREVIOUS')void moveQuestion((S.question?.position||0)-1);else if(actionName==='SET_CONFIDENCE')setConfidence(value,true);else if(actionName==='REVEAL_START')holdReveal(value);else if(actionName==='REVEAL_END')releaseReveal();}
function browseWord(direction){if(S.view!=='dictionary'||!S.dictionary.items.length)return;let next=S.dictionary.focus+direction;if(next<0&&S.dictionary.offset>0){S.dictionary.offset=Math.max(0,S.dictionary.offset-S.dictionary.limit);void loadDictionary();return;}if(next>=S.dictionary.items.length&&S.dictionary.offset+S.dictionary.limit<S.dictionary.total){S.dictionary.offset+=S.dictionary.limit;void loadDictionary();return;}S.dictionary.focus=Math.max(0,Math.min(S.dictionary.items.length-1,next));const r=S.dictionary.items[S.dictionary.focus],card=$(`[data-corpus-card="${r.id}"]`);card?.focus({preventScroll:true});card?.scrollIntoView({behavior:'smooth',block:'center'});log(direction>0?'next':'previous','corpus:'+id8(r.id));}

document.addEventListener('input',event=>{const el=event.target;if(el.id==='confidence'){setConfidence(el.value);return;}if(el.id==='clozeAnswer'&&S.draft){S.draft.answer_text=el.value;return;}if(el.dataset.query){const context=el.dataset.query;S.filters[context].free_text=el.value;const run=()=>{if((context==='dictionary'&&S.view==='dictionary')||(context==='setup'&&S.view==='submode_selection')||(context==='data'&&S.view==='data'))applyFilters(context,'search');};if(context==='dictionary'){clearTimeout(searchTimer);searchTimer=setTimeout(run,400);}else if(context==='setup'){clearTimeout(candidateTimer);candidateTimer=setTimeout(run,400);}else{clearTimeout(dataTimer);dataTimer=setTimeout(run,400);}}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='confidence'){setConfidence(el.value,true);return;}if(el.dataset.filter){applyFilters(el.dataset.context);return;}const ctx=el.dataset.confidenceFilter||el.dataset.rangeMin||el.dataset.rangeMax||el.dataset.dateFrom||el.dataset.dateTo;if(ctx){applyFilters(ctx);return;}if(el.id==='showJP'){S.dictionary.jp=el.checked;if(!el.checked)S.dictionary.revealed.clear();suppressMeaningLog=true;$$('[data-meaning]').forEach(d=>d.open=el.checked);setTimeout(()=>suppressMeaningLog=false,0);log(el.checked?'reveal':'hide','dictionary:all');return;}if(el.id==='quizTypeSelect'){sessionOperation++;S.setup.starting=false;readFilters('setup');S.setup.quiz_type=el.value;S.setup.variant=variants[el.value][0]||null;log('choose','quiz_type',el.value);renderSetup();void loadCandidates();void loadSessions();return;}if(el.id==='variantSelect'){S.setup.variant=el.value||null;log('choose','variant',el.value);void loadCandidates();return;}if(el.id==='questionCount'||el.id==='allQuestions'){const all=$('#allQuestions').checked;$('#questionCount').disabled=all;S.filters.setup.requested_count=all?-1:Number($('#questionCount').value);log('filter','requested_count',S.filters.setup.requested_count);return;}if(el.id==='questionJump'){void moveQuestion(Number(el.value));return;}if(el.id==='dataQuizType'){S.data.quiz_type=el.value;S.data.variant='';S.data.offset=0;$('#dataVariant').innerHTML=optionList(dataVariantOptions(),'','すべての形式');log('filter','data:quiz_type',el.value);void loadData();return;}if(el.id==='dataVariant'){S.data.variant=el.value;S.data.offset=0;log('filter','data:variant',el.value);void loadData();return;}if(el.id==='actionScreen'){S.data.screen=el.value;S.data.action_offset=0;log('filter','data:screen',el.value);void loadData();return;}if(el.id==='actionEvent'){S.data.event=el.value;S.data.action_offset=0;log('filter','data:event',el.value);void loadData();return;}});

function resetSwipe(){if(swipe?.element?.isConnected){swipe.element.style.transform='';swipe.element.style.transition='';$$('.swipe-indicator',swipe.element).forEach(e=>e.style.opacity='');}swipe=null;}
document.addEventListener('pointerdown',event=>{const hold=event.target.closest('[data-hold]');if(hold){event.preventDefault();dispatch('REVEAL_START',hold.dataset.hold);return;}if(S.menu||$('#collectionDialog').open||event.button>0)return;const card=event.target.closest('#readingCard,[data-quiz-swipe],[data-corpus-card]');if(!card||event.target.closest('button,input,select,summary,details'))return;if(card.id==='readingCard'&&(S.draft?.saved||S.draft?.pending))return;swipe={element:card,x:event.clientX,y:event.clientY,dx:0,dy:0,pointerId:event.pointerId,reading:card.id==='readingCard',dictionary:card.hasAttribute('data-corpus-card'),horizontal:false};if(swipe.dictionary)S.dictionary.focus=Number(card.dataset.cardIndex);try{card.setPointerCapture(event.pointerId);}catch(_e){} });
document.addEventListener('pointermove',event=>{if(!swipe||swipe.pointerId!==event.pointerId)return;const dx=event.clientX-swipe.x,dy=event.clientY-swipe.y;swipe.dx=dx;swipe.dy=dy;if(Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx)*1.3){resetSwipe();return;}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){swipe.horizontal=true;if(swipe.reading){swipe.element.style.transition='none';const x=Math.max(-135,Math.min(135,dx));swipe.element.style.transform=`translateX(${x}px) rotate(${x/24}deg)`;const yes=$('.swipe-indicator.yes',swipe.element),no=$('.swipe-indicator.no',swipe.element);if(yes)yes.style.opacity=dx>0?Math.min(1,dx/75):0;if(no)no.style.opacity=dx<0?Math.min(1,-dx/75):0;}}});
document.addEventListener('pointerup',event=>{releaseReveal();if(!swipe||swipe.pointerId!==event.pointerId)return;const gesture=swipe,dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;resetSwipe();if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.4)return;if(gesture.reading)dispatch('RATE',dx>0?1:0);else if(gesture.dictionary)browseWord(dx<0?1:-1);else dispatch(dx<0?'NEXT':'PREVIOUS');});

document.addEventListener('keydown',event=>{if(event.isComposing||event.ctrlKey||event.metaKey||event.altKey)return;if(event.key==='Escape'){releaseReveal();resetSwipe();if(S.menu){event.preventDefault();setMenu(false);}return;}if(S.menu){if(event.key==='Tab'){const nodes=$$('button:not(:disabled)', $('#drawer'));if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}return;}if($('#collectionDialog').open)return;const hold=event.target.closest?.('[data-hold]');if(hold&&[' ','Enter'].includes(event.key)){event.preventDefault();if(!event.repeat)dispatch('REVEAL_START',hold.dataset.hold);return;}if(event.target.matches('input,select,textarea,[contenteditable="true"]')){if(event.target.id==='clozeAnswer'&&event.key==='Enter'&&!event.repeat){event.preventDefault();dispatch('SUBMIT');}return;}if(event.target.closest('button,a,summary')&&['Enter',' '].includes(event.key))return;if(S.view==='dictionary'){if(event.key==='ArrowRight'){event.preventDefault();browseWord(1);}else if(event.key==='ArrowLeft'){event.preventDefault();browseWord(-1);}else if(event.key===' '&&!event.repeat&&S.dictionary.items[S.dictionary.focus]){event.preventDefault();dispatch('REVEAL_START','corpus-'+S.dictionary.items[S.dictionary.focus].id);}return;}if(!isQuiz()||!S.question)return;const key=event.key.toLowerCase();if(S.question.quiz_type==='word_recall'){const index='1234'.includes(key)?'1234'.indexOf(key):['a','b','x','y'].indexOf(key);if(index>=0&&S.question.options[index]){event.preventDefault();dispatch('CHOOSE',S.question.options[index].id);return;}}if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();if(S.question.quiz_type==='reading_review')dispatch('RATE',event.key==='ArrowRight'?1:0);else dispatch(event.key==='ArrowRight'?'NEXT':'PREVIOUS');}else if(event.key==='Enter'&&!event.repeat){event.preventDefault();if(S.draft?.saved)dispatch('NEXT');else dispatch('SUBMIT');}else if(key==='u'&&!event.repeat){event.preventDefault();dispatch('UNKNOWN');}else if(event.key===' '&&S.question.quiz_type==='reading_review'&&!event.repeat){event.preventDefault();dispatch('REVEAL_START','reading');}});

let gamepadLast=[],gamepadTime=0,stickTime=0;
function gamepadTick(now){const pads=navigator.getGamepads?navigator.getGamepads():[],pad=Array.from(pads).find(Boolean);if(pad&&matchMedia('(min-width:761px)').matches&&!S.menu&&!$('#collectionDialog').open&&(isQuiz()||S.view==='dictionary')){const pressed=pad.buttons.map(b=>b.pressed),edge=i=>pressed[i]&&!gamepadLast[i];if(isQuiz()&&S.question){if(S.question.quiz_type==='word_recall'){[0,1,2,3].forEach((i)=>{if(edge(i)&&S.question.options[i])dispatch('CHOOSE',S.question.options[i].id);});}else if(S.question.quiz_type==='reading_review'){if(edge(0))dispatch('REVEAL_START','reading');if(!pressed[0]&&gamepadLast[0])dispatch('REVEAL_END');if(edge(2)||edge(14))dispatch('RATE',0);if(edge(3)||edge(15))dispatch('RATE',1);}if(edge(4))dispatch('PREVIOUS');if(edge(5))dispatch('NEXT');if(edge(11))dispatch('SUBMIT');if(edge(9))dispatch('UNKNOWN');if(now-gamepadTime>150&&(pressed[6]||pressed[7])){dispatch('SET_CONFIDENCE',(S.draft?.confidence??50)+(pressed[7]?5:-5));gamepadTime=now;}if(now-stickTime>220){if(Math.abs(pad.axes[1]||0)>.65){dispatch('SET_CONFIDENCE',(S.draft?.confidence??50)+(pad.axes[1]<0?5:-5));stickTime=now;}else if(Math.abs(pad.axes[0]||0)>.65){const buttons=$$('.answer-choice:not(:disabled),[data-recalled]:not(:disabled)');if(buttons.length){const current=buttons.indexOf(document.activeElement),next=(Math.max(0,current)+(pad.axes[0]>0?1:-1)+buttons.length)%buttons.length;buttons[next].focus();}stickTime=now;}}}else if(S.view==='dictionary'){if(edge(4))browseWord(-1);if(edge(5))browseWord(1);if(edge(0)&&S.dictionary.items[S.dictionary.focus])dispatch('REVEAL_START','corpus-'+S.dictionary.items[S.dictionary.focus].id);if(!pressed[0]&&gamepadLast[0])dispatch('REVEAL_END');if(now-stickTime>220&&Math.abs(pad.axes[1]||0)>.65){browseWord(pad.axes[1]>0?1:-1);stickTime=now;}}gamepadLast=pressed;}else gamepadLast=[];requestAnimationFrame(gamepadTick);}
window.addEventListener('popstate',()=>{const view=location.hash.slice(1);route(titles[view]?view:'hero',{hash:false});});
document.addEventListener('visibilitychange',()=>{releaseReveal();resetSwipe();log(document.hidden?'hidden':'visible');void flushActions(document.hidden);});
window.addEventListener('pagehide',()=>{log('leave');void flushActions(true);});
setInterval(()=>void flushActions(),30000);
async function ensureReady(){if(!S.ready)await bootPromise;if(!S.ready)throw new Error(S.bootError||'接続を確認してください。');}
async function boot(){S.bootError='';status();try{const [meta,collections,activity]=await Promise.all([api('/api/meta'),api('/api/collections'),api('/api/activity',{})]);S.meta=meta;S.collections=collections.items||[];S.activity=activity.activity_id;S.ready=true;pending.forEach(e=>{if(!e.activity_id)e.activity_id=S.activity;});persistPending();status();if(S.view==='hero')$('#main [data-reconnect]')?.closest('.spaced')?.remove();else if(S.view==='submode_selection')paintCandidates();void flushActions();return true;}catch(e){S.ready=false;S.bootError=e.message;status();if(S.view==='hero'){const hero=$('#main .hero'),existing=$('#main [data-reconnect]')?.closest('.spaced'),warning=existing||document.createElement('div');warning.className='spaced';warning.innerHTML=noticeError(S.bootError)+'<button class="btn secondary" type="button" data-reconnect>再接続</button>';if(!existing&&hero)hero.append(warning);}return false;}}
renderHero();log('enter',null,null,'hero');
let bootPromise=boot();
const initialView=location.hash.slice(1);if(initialView&&initialView!=='hero')route(titles[initialView]?initialView:'hero',{hash:false,focus:false});
requestAnimationFrame(gamepadTick);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
